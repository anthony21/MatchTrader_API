[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "hcamm-matchtrader"
version = "1.0.0"
description = "Broker-configurable Match-Trader REST client, optional WebSocket transport and analytics"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.10,<3", "python-dotenv>=1,<2", "pandas>=2.2,<4", "numpy>=2,<3", "websockets>=15,<18"]

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = ">=8,<10"
pytest-cov = ">=6,<8"
ruff = ">=0.12,<1"

[project.scripts]
matchtrader = "matchtrader.cli:main"
matchtrader-bridge = "matchtrader.bridge.cli:main"
matchtrader-dashboard = "matchtrader.dashboard.cli:main"

[tool.poetry]
requires-poetry = ">=2.2,<3"
packages = [{ include = "matchtrader", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests", "relay/tests"]
addopts = "--import-mode=importlib -ra --cov=matchtrader --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4", "RUF"]
